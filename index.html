<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaisaKhabar Newsroom OS v2.0 - Financial News Intelligence & Alignment Engine</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/custom.css">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 1. Top Global Navigation Header -->
    <header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 flex items-center justify-between shrink-0 z-30 sticky top-0 shadow-sm">
        <div class="flex items-center space-x-4">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center text-white font-black text-lg shadow-md shadow-amber-500/20 shrink-0">
                    <span>₹</span>
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <h1 class="font-black text-sm tracking-tight text-slate-900 dark:text-white">PAISAKHABAR</h1>
                        <span class="px-1.5 py-0.2 rounded bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 font-mono text-[9px] font-bold border border-indigo-500/20">NEWSROOM OS 2.0</span>
                    </div>
                    <p class="text-[10px] text-slate-400 font-medium">Financial News Intelligence & Alignment Engine</p>
                </div>
            </div>

            <!-- Live Ingestion Radar Status -->
            <div class="hidden md:flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-[11px] font-bold">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Live Regulatory Scanner Active</span>
            </div>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center space-x-3">
            <!-- Search Filter -->
            <div class="relative hidden sm:block">
                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input oninput="window.newsStore.setSearchQuery(this.value)" placeholder="Search banking, tax, EPFO..." class="pl-8 pr-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800/80 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-indigo-500 w-44 md:w-60">
            </div>

            <!-- Ingest Topic Button -->
            <button onclick="window.app.openIngestModal()" class="px-3.5 py-1.5 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center space-x-1.5">
                <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
                <span>+ Ingest Breaking Topic</span>
            </button>

            <!-- Dark Mode Toggle -->
            <button onclick="window.app.toggleDarkMode()" title="Toggle Dark/Light Mode" class="p-2 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                <i data-lucide="moon" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- 2. Live Market Pulse Ticker Bar -->
    <div class="bg-slate-100 dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800/80 overflow-hidden px-4">
        <div id="marketTickerContainer"></div>
    </div>

    <!-- 3. Category Filter Navigation Bar -->
    <div class="bg-white dark:bg-slate-900/60 border-b border-slate-200 dark:border-slate-800 px-6 py-2.5 overflow-x-auto">
        <div class="flex items-center space-x-2 text-xs font-bold shrink-0">
            <button onclick="window.app.setCategory('all')" class="px-3 py-1 rounded-xl bg-indigo-600 text-white shadow-sm">All News</button>
            <button onclick="window.app.setCategory('banking_fd')" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900">🏦 Banking & FDs</button>
            <button onclick="window.app.setCategory('pension_epfo')" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900">🏛️ EPFO & EPS-95</button>
            <button onclick="window.app.setCategory('stock_market')" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900">📈 Stocks & IPOs</button>
            <button onclick="window.app.setCategory('gold_commodities')" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900">🪙 Gold & Silver</button>
            <button onclick="window.app.setCategory('tax_itr')" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900">💰 Income Tax & ITR</button>
            <button onclick="window.app.setCategory('govt_schemes')" class="px-3 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900">🇮🇳 Govt Schemes</button>
        </div>
    </div>

    <!-- 4. Main 3-Pane Grid Content -->
    <main class="flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-5 max-w-[1800px] w-full mx-auto">
        
        <!-- Column 1 (Left 3.5 cols): Financial Live Radar -->
        <section class="lg:col-span-4 flex flex-col space-y-3">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-ping"></span>
                    <h3 class="font-extrabold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300">Live Financial Radar</h3>
                </div>
                <span class="text-[10px] font-bold text-slate-400">Auto-Clustered Streams</span>
            </div>

            <div id="radarListContainer" class="flex-1 overflow-y-auto max-h-[calc(100vh-210px)] pr-1"></div>
        </section>

        <!-- Column 2 (Center 4.5 cols): AI Alignment Workbench -->
        <section class="lg:col-span-5 flex flex-col space-y-3">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center space-x-2">
                    <i data-lucide="cpu" class="w-4 h-4 text-indigo-500"></i>
                    <h3 class="font-extrabold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300">AI Alignment Workbench</h3>
                </div>
                <span class="text-[10px] font-bold text-emerald-500">3-Pillar Hindi Structuring</span>
            </div>

            <div id="workbenchContainer" class="flex-1 overflow-y-auto max-h-[calc(100vh-210px)] pr-1"></div>
        </section>

        <!-- Column 3 (Right 4 cols): Multi-Channel Studio Preview -->
        <section class="lg:col-span-3 flex flex-col space-y-3">
            <div class="flex items-center justify-between px-1">
                <div class="flex items-center space-x-2">
                    <i data-lucide="share-2" class="w-4 h-4 text-purple-500"></i>
                    <h3 class="font-extrabold text-xs uppercase tracking-wider text-slate-700 dark:text-slate-300">Multi-Channel Studio</h3>
                </div>
                <span class="text-[10px] font-bold text-indigo-500">1-Click Multi-Format</span>
            </div>

            <div id="studioContainer" class="flex-1 overflow-y-auto max-h-[calc(100vh-210px)] pr-1"></div>
        </section>
    </main>

    <!-- Modal Container -->
    <div id="modalContainer"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none"></div>

    <!-- Application JS Scripts -->
    <script src="js/store.js"></script>
    <script src="js/feedEngine.js"></script>
    <script src="js/aiAligner.js"></script>
    <script src="js/cardCanvas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
